<div class="container-list min-h-screen ">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="grid grid-cols-2 gap-4 my-2">

        <div class="col-span-2">
            <label>Current Password</label>
                <app-input-password [controlNameInput]="'Enter New password'" [placeholder]="'Re-enter Password'" [control]="form.get('oldPassword')!"
        [Validation]="ValidationRequired"></app-input-password>
        </div>
        <div class="col-span-2">
            <label>New Password</label>
               <app-input-password [controlNameInput]="'Enter New password'" [placeholder]="'Re-enter Password'" [control]="form.get('password')!"
        [Validation]="ValidationRequired"></app-input-password>
        </div>

        <div class="col-span-2">
        <label>Confirm New Password</label>
            <app-input-password [controlNameInput]="'Enter New password'" [placeholder]="'Re-enter Password'" [control]="form.get('rePassword')!"
        [Validation]="ValidationRequired"></app-input-password>
        </div>



    </form>


    <div class=" my-5">
        <app-button class="w-1/1" (click)="onSubmit()" [title]="'Update Password'"></app-button>
    </div>
</div>
