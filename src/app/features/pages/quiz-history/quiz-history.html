<div class="grid grid-cols-12 gap-6 min-h-screen">

  <!-- Sidebar -->
  <div class="col-span-12 lg:col-span-4 container-list">
    <div class="list h-full flex flex-col">

      <ul class="menu text-gray text-xl font-semibold flex flex-col gap-4 flex-1">

<button 
  [routerLink]="'profile'" 
  routerLinkActive="active-link" 
  [routerLinkActiveOptions]="{ exact: true }"
  class="menu-item">
  <i class="pi pi-users"></i>
  Profile
</button>

<button 
  [routerLink]="'changePassword'" 
  routerLinkActive="active-link" 
  [routerLinkActiveOptions]="{ exact: true }"
  class="menu-item">
  <i class="pi pi-lock"></i>
  Change Password
</button>

        <button
          (click)="logout()"
          class="warning_button menu-item mt-auto"
        >
          <i class="pi pi-arrow-left"></i>
          Log Out
        </button>

      </ul>

    </div>
  </div>

  <!-- Content -->
  <div class="col-span-12 lg:col-span-8">
    <router-outlet></router-outlet>
  </div>

</div>
